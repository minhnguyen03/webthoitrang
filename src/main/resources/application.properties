spring.application.name=fashion

# Encoding Configuration
#spring.mandatory-file-encoding=UTF-8
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Database Configuration
spring.datasource.url=jdbc:mariadb://localhost:3306/csdl?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:280303}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# Prevent immediate failure if DB is not available
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.continue-on-error=false

# Static resources
spring.web.resources.static-locations=classpath:/static/,file:./uploads/,file:./src/main/resources/static/
# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
# Defer datasource initialization
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
jwt.secret=your-super-secret-key-at-least-256-bits-long-2026-fashion-shop-iuh-fit
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=604800000

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always
# Async request timeout — cần đủ dài cho SSE streaming (10 phút)
spring.mvc.async.request-timeout=600000

# Logging
logging.level.fit.iuh.edu.fashion=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# File Upload Configuration
upload.path=src/main/resources/static/image
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.enabled=true

# VNPay Configuration (Sandbox)
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
# Return URL - Must be registered in VNPay Dashboard
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/payment/vnpay/callback}
# IPN URL - For async payment notification
vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8080/api/payment/vnpay/ipn}
vnpay.version=2.1.0
vnpay.command=pay
vnpay.order-type=other

# Spring AI - LM Studio Configuration (via OpenAI compatible API)
spring.ai.openai.api-key=lm-studio
# Base URL without /v1 - Spring AI adds it automatically
spring.ai.openai.base-url=http://127.0.0.1:1234
# Model name — must match the model loaded in LM Studio
spring.ai.openai.chat.options.model=lmstudio-community/qwen3.5-2b
spring.ai.openai.chat.options.temperature=0.35
# Default output budget for factual ecommerce answers; long comparison flows can still stream up to the SSE timeout.
spring.ai.openai.chat.options.max-tokens=2048
# Timeout cho LM Studio generation (5 phút)
spring.ai.openai.chat.options.timeout=300s

# HTTP Client Timeouts for Spring AI
spring.threads.virtual.enabled=false

# App Chat Configuration
app.chat.default-system=Bạn là trợ lý mua sắm thời trang. Trả lời thân thiện, chi tiết khi cần.

# Conversation Memory Configuration — tăng để hỗ trợ hội thoại dài
app.chat.memory.max-messages=30
app.chat.memory.ttl-minutes=60

# Spring AI Embedding - Uses local ONNX TransformersEmbeddingModel (all-MiniLM-L6-v2)
# Auto-downloads model on first run, runs 100% offline after that
# No API key needed, no LM Studio dependency for embeddings
# IMPORTANT: Disable OpenAI embedding auto-config to prevent bean conflict
spring.ai.openai.embedding.enabled=false

# Redis Configuration - ENABLED for caching
spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Cache Configuration - Using Redis
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# Email Configuration (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App Configuration
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

